<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <script>
      // The phase popup (/popup) and the screen tint (/tint) are transparent overlay windows: mark them before
      // the first paint so they never flash the opaque app background (the tint window covers whole monitors).
      if (/^\/(popup|tint)\/?$/.test(location.pathname)) document.documentElement.setAttribute("data-overlay", "");
    </script>
    <style>
      html {
        background: #110b19;
        color-scheme: dark;
      }
      html[data-overlay],
      html[data-overlay] body {
        background: transparent !important;
        /* A light scheme keeps the WebView canvas transparent (no dark canvas fill behind the page). */
        color-scheme: light !important;
      }
    </style>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>FocusMode</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

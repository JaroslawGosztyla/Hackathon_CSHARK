<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocusMode</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <main class="popup__main" data-mode="loading">
      <header class="popup__header">
        <img src="icons/icon-32.png" alt="" width="28" height="28" />
        <h1 class="popup__title">FocusMode</h1>
      </header>

      <p class="connection" id="connection" role="status" aria-live="polite">
        <span class="connection__dot" aria-hidden="true"></span>
        <span id="connection-text">Sprawdzam połączenie…</span>
      </p>

      <section class="phase-card" aria-labelledby="phase">
        <p class="phase-card__phase" id="phase">—</p>
        <p class="phase-card__clock" id="clock">--:--</p>
        <p class="phase-card__hint" id="phase-hint"></p>
      </section>

      <dl class="facts">
        <div class="facts__row">
          <dt>Blokowanie stron</dt>
          <dd id="blocking">—</dd>
        </div>
        <div class="facts__row">
          <dt>Blokowane domeny</dt>
          <dd id="domain-count">—</dd>
        </div>
      </dl>

      <details class="domains" id="domains" hidden>
        <summary>Pokaż blokowane domeny</summary>
        <ul class="domains__list" id="domain-list"></ul>
      </details>

      <button type="button" class="btn btn--ghost popup__refresh" id="refresh">Odśwież</button>

      <p class="popup__privacy">
        Rozszerzenie łączy się tylko z aplikacją FocusMode na tym komputerze (127.0.0.1).
        Nic nie jest wysyłane do internetu.
      </p>
    </main>
  </body>
</html>

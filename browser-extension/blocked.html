<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Wracaj do pracy — FocusMode</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="blocked.css" />
    <script type="module" src="blocked.js"></script>
  </head>
  <body class="blocked">
    <div class="sky" aria-hidden="true">
      <div class="sky__moon"></div>
      <div class="sky__rain sky__rain--far"></div>
      <div class="sky__rain sky__rain--near"></div>
      <div class="sky__glow"></div>
    </div>

    <main class="card" id="card" data-mode="loading">
      <p class="card__eyebrow">FocusMode</p>

      <h1 class="card__headline">
        <span id="headline">Wracaj do pracy</span>
        <span class="card__emoji" id="headline-emoji" aria-hidden="true">🎧</span>
      </h1>

      <p class="card__site" id="site">Ta strona poczeka do przerwy.</p>

      <div class="timer" id="timer">
        <p class="timer__label" id="timer-label">Do przerwy zostało</p>
        <p class="timer__clock" id="timer-clock">--:--</p>
      </div>

      <p class="card__line" id="line"></p>

      <div class="card__actions">
        <a class="btn btn--primary" id="open" href="#" rel="noreferrer" hidden>Otwórz stronę</a>
        <button type="button" class="btn btn--ghost" id="back">Wróć</button>
      </div>

      <p class="card__status" id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>

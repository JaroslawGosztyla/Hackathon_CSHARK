[package]
name = "focus-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
focus-core = { version = "0.1.0", path = "../focus-core" }
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "form", "native-tls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization", "Win32_System_RemoteDesktop"] }

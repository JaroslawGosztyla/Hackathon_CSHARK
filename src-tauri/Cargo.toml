[package]
name = "focusmode"
version = "0.1.0"
description = "FocusMode desktop shell (Tauri)"
authors = ["FocusMode team"]
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focusmode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.6.0"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-log = "2.10.1"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt"] }
tiny_http = "0.12.0"
anyhow = "1.0.104"
log = "0.4.34"
focus-core = { version = "0.1.0", path = "../crates/focus-core" }
focus-audio = { version = "0.1.0", path = "../crates/focus-audio" }
focus-platform = { version = "0.1.0", path = "../crates/focus-platform" }
